<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="961" viewBox="0 0 1200 961" role="group" aria-labelledby="title" aria-describedby="description">
<title id="title">From evidence to care and learning</title>
<desc id="description">Research and public-health surveillance inform clinical practice guidelines and decision support. Clinical care supplies data for measurement, analytics, reporting, and further evidence review. Shared FHIR data and knowledge sit at the center. Standards labels illustrate related roles, not a required dependency set or mandatory sequence. Reviewers decide how findings change guidance and local implementation.</desc>
