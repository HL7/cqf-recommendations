      <g id="revised-guidance">
        <path d="M860 121H1088L1108 141V189H860Z" fill="#fff" stroke="#6384a8" stroke-width="1.7"/>
        <path d="M1088 121V141H1108" fill="none" stroke="#6384a8" stroke-width="1.7"/>
        <text x="878" y="150" font-size="20" font-weight="700">Revised narrative</text>
        <text x="878" y="176" font-size="18">Clinical clarifications</text>
      </g>
    </g>
    <g id="specification-work-products">
      <g id="structured-template">
        <rect x="260" y="246" width="272" height="92" rx="7" fill="#fff" stroke="#6384a8" stroke-width="1.7"/>
        <g transform="translate(273 263)" fill="none" stroke="#345c84" stroke-width="1.6">
          <rect width="30" height="42" rx="3"/>
          <path d="M0 12H30M0 22H30M0 32H30M12 12V42"/>
        </g>
        <text x="314" y="272" font-size="20" font-weight="700">Structured template</text>
        <text x="314" y="298" font-size="18">Recommendation, data</text>
        <text x="314" y="320" font-size="18">dictionary, and logic</text>
      </g>
      <g id="decision-flow">
        <rect x="560" y="246" width="251" height="92" rx="7" fill="#fff" stroke="#6384a8" stroke-width="1.7"/>
        <g transform="translate(574 264)" fill="#eaf2fa" stroke="#345c84" stroke-width="1.6">
          <path d="M16 0L31 13L16 26L1 13Z"/>
          <path d="M16 26V35M7 35H25" fill="none"/>
          <rect x="1" y="36" width="11" height="10" rx="1"/>
          <rect x="20" y="36" width="11" height="10" rx="1"/>
        </g>
        <text x="615" y="272" font-size="20" font-weight="700">Decision flow</text>
        <text x="615" y="298" font-size="18">Data, decisions, and</text>
        <text x="615" y="320" font-size="18">possible interventions</text>
      </g>
      <g id="case-presentations">
        <rect x="837" y="246" width="271" height="92" rx="7" fill="#fff" stroke="#9578b0" stroke-width="1.7"/>
        <g transform="translate(850 262)" fill="none" stroke="#674986" stroke-width="1.6">
          <path d="M5 0H24L33 9V44H5Z M24 0V9H33 M11 17H27 M11 24H27 M11 31H27"/>
          <path d="M0 6V49H29"/>
