<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 789" role="img" aria-labelledby="title description">
  <!-- Sources: image14.png and image2.png supply the role lanes and handoffs; image3.png supplies the decision-flow sketch; image1.png the class hierarchy; image12.png the DMN/CMMN and concept review; image25.png the CMMN stage sketch; image31.png the model-to-artifact mapping; image29.png the case-to-test pairing. -->
  <title id="title">Work products from the historical 2020 case study</title>
  <desc id="description">The 2020 emergency-department COVID-19 project used four roles to develop and review work products. Clinical authors drafted and revised the narrative. Subject-matter engineers made concepts and decisions explicit and turned case presentations into examples. Terminology specialists defined classes and codes. Technical engineers explored DMN decisions and CMMN stages, candidate FHIR and CQL artifacts, and case-based checks. Review findings went back to the clinical authors.</desc>
  <defs>
    <marker id="handoff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#52697d"/>
    </marker>
    <marker id="case-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#674986"/>
    </marker>
    <marker id="review" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9b5d23"/>
    </marker>
  </defs>
  <rect width="1200" height="789" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#21313c">
    <g id="heading">
      <text x="36" y="44" font-size="30" font-weight="700">Work products from the historical 2020 case study</text>
      <text x="36" y="75" font-size="21">COVID-19 emergency-department guideline development and review</text>
    </g>
    <g id="role-lanes">
      <rect x="36" y="103" width="1128" height="104" rx="8" fill="#eef4fb" stroke="#9eb4cc" stroke-width="1.5"/>
      <rect x="36" y="227" width="1128" height="130" rx="8" fill="#eef4fb" stroke="#9eb4cc" stroke-width="1.5"/>
      <rect x="36" y="377" width="1128" height="106" rx="8" fill="#eaf5f1" stroke="#92b8ac" stroke-width="1.5"/>
      <rect x="36" y="503" width="1128" height="220" rx="8" fill="#f7f6fb" stroke="#a899ba" stroke-width="1.5"/>
      <path d="M237 103V207M237 227V357M237 377V483M237 503V723" fill="none" stroke="#a3b2bf" stroke-width="1.5"/>
      <g font-size="20" font-weight="700">
        <text x="54" y="144">Clinical authors</text>
        <text x="54" y="258"><tspan x="54">Subject-matter</tspan><tspan x="54" dy="23">knowledge</tspan><tspan x="54" dy="23">engineers</tspan></text>
        <text x="54" y="411"><tspan x="54">Terminology</tspan><tspan x="54" dy="24">and ontology</tspan></text>
        <text x="54" y="552"><tspan x="54">Technical</tspan><tspan x="54" dy="23">knowledge</tspan><tspan x="54" dy="23">engineers</tspan></text>
      </g>
      <g font-size="18">
        <text x="54" y="172">Scope and clarify</text>
        <text x="54" y="334">Specify decisions</text>
        <text x="54" y="461">Define concepts</text>
        <text x="54" y="628">Model and test</text>
      </g>
    </g>
    <g id="handoff-connectors" fill="none" stroke="#52697d" stroke-width="2.3" stroke-linejoin="round">
      <path d="M397 189V244" marker-end="url(#handoff)"/>
      <path d="M397 338V389" marker-end="url(#handoff)"/>
      <path d="M532 289H558" marker-end="url(#handoff)"/>
      <path d="M352 469V542" marker-end="url(#handoff)"/>
      <path d="M466 610H446" marker-end="url(#handoff)"/>
      <path d="M352 684V704H782V687" marker-end="url(#handoff)"/>
      <path d="M564 684V704"/>
      <path d="M881 614H910" marker-end="url(#handoff)"/>
    </g>
    <g id="cases-to-tests">
      <path d="M1108 290H1127V532H1014V542" fill="none" stroke="#674986" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#case-input)"/>
    </g>
    <g id="review-feedback">
      <path d="M1108 614H1145V156H1111" fill="none" stroke="#9b5d23" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#review)"/>
      <text x="585" y="148" font-size="20" font-weight="700" fill="#743c12">Cross-functional review</text>
      <text x="585" y="174" font-size="18" fill="#743c12">Return open questions to authors</text>
    </g>
    <g id="clinical-work-products">
      <g id="narrative-draft">
        <path d="M260 121H510L530 141V189H260Z" fill="#fff" stroke="#6384a8" stroke-width="1.7"/>
        <path d="M510 121V141H530" fill="none" stroke="#6384a8" stroke-width="1.7"/>
        <text x="278" y="150" font-size="20" font-weight="700">Draft narrative</text>
        <text x="278" y="176" font-size="18">Rapid review and ED scope</text>
