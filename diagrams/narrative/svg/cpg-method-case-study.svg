          <path d="M0 15H158M0 33H158M53 0V51M106 0V51" fill="none"/>
        </g>
        <text x="274" y="663" font-size="18">Inference and logic</text>
      </g>
      <g id="cmmn-model">
        <rect x="467" y="545" width="194" height="139" rx="7" fill="#fff" stroke="#9578b0" stroke-width="1.7"/>
        <text x="481" y="574" font-size="20" font-weight="700" fill="#674986">CMMN stages</text>
        <path d="M487 586H640L647 593V630L640 637H487L481 630V593Z" fill="#f3eef9" stroke="#80639b" stroke-width="1.6"/>
        <g fill="#fff" stroke="#80639b" stroke-width="1.6">
