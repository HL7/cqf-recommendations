        <text x="699" y="574" font-size="20" font-weight="700" fill="#286e5d">FHIR and CQL</text>
        <g transform="translate(700 589)" fill="none" stroke="#286e5d" stroke-width="1.6">
          <path d="M0 0H28L38 10V47H0Z M28 0V10H38 M8 17H30 M8 24H30 M8 31H26"/>
        </g>
        <text x="747" y="607" font-size="18">PlanDefinition</text>
        <text x="747" y="631" font-size="18">Library</text>
        <text x="699" y="663" font-size="18">Candidate artifacts</text>
      </g>
      <g id="test-bundles">
        <rect x="913" y="545" width="195" height="139" rx="7" fill="#fff" stroke="#9578b0" stroke-width="1.7"/>
        <text x="928" y="574" font-size="20" font-weight="700" fill="#674986">Test Bundles</text>
        <g transform="translate(929 592)" fill="none" stroke="#674986" stroke-width="2">
          <rect width="30" height="40" rx="3"/>
          <path d="M7 13L12 17L23 7M7 28L12 32L23 22"/>
        </g>
        <text x="970" y="606" font-size="18">Compare with</text>
        <text x="970" y="630" font-size="18">expected results</text>
        <text x="928" y="663" font-size="18">Validation findings</text>
      </g>
    </g>
    <g id="historical-scope-and-legend">
      <path d="M37 748H81" fill="none" stroke="#674986" stroke-width="2.5" marker-end="url(#case-input)"/>
      <text x="93" y="754" font-size="18">Cases inform tests</text>
      <path d="M284 748H328" fill="none" stroke="#9b5d23" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#review)"/>
      <text x="340" y="754" font-size="18">Review feedback</text>
      <text x="1164" y="754" font-size="18" text-anchor="end">Historical methodology account, November 2020</text>
    </g>
  </g>
</svg>
