        <text x="893" y="272" font-size="20" font-weight="700" fill="#674986">Case presentations</text>
        <text x="893" y="298" font-size="18">Sample patient inputs</text>
        <text x="893" y="320" font-size="18">and expected results</text>
      </g>
    </g>
    <g id="terminology-work-products">
      <g id="clinical-class-hierarchy">
        <rect x="260" y="391" width="558" height="78" rx="7" fill="#fff" stroke="#548d7e" stroke-width="1.7"/>
        <text x="275" y="424" font-size="20" font-weight="700" fill="#286e5d">Health care process</text>
        <text x="275" y="449" font-size="18">Ontology class</text>
        <path d="M465 430H478V412H492M478 430V447H492" fill="none" stroke="#548d7e" stroke-width="1.8"/>
        <circle cx="496" cy="412" r="4" fill="#286e5d"/>
        <circle cx="496" cy="447" r="4" fill="#286e5d"/>
        <text x="509" y="418" font-size="18">Clinical evaluation process</text>
        <text x="509" y="453" font-size="18">Health care encounter</text>
        <path d="M688 447H701" fill="none" stroke="#548d7e" stroke-width="1.8"/>
        <text x="708" y="453" font-size="17">ED encounter</text>
      </g>
      <g id="codes-and-value-sets">
        <rect x="837" y="391" width="271" height="78" rx="7" fill="#fff" stroke="#548d7e" stroke-width="1.7"/>
        <text x="855" y="422" font-size="20" font-weight="700" fill="#286e5d">Codes and value sets</text>
        <text x="855" y="449" font-size="18">Candidate mappings</text>
      </g>
    </g>
    <g id="engineering-work-products">
      <text x="424" y="528" font-size="18" font-weight="700" fill="#674986">Models, candidate artifacts, and case-based checks</text>
      <g id="dmn-model">
        <rect x="260" y="545" width="185" height="139" rx="7" fill="#fff" stroke="#9578b0" stroke-width="1.7"/>
        <text x="274" y="574" font-size="20" font-weight="700" fill="#674986">DMN decisions</text>
        <g transform="translate(273 586)" fill="#f3eef9" stroke="#80639b" stroke-width="1.6">
