<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355" role="img" aria-labelledby="title description">
<title id="title">Separate proposed care, authorization and occurrence</title><desc id="description">A patient-specific proposal can be accepted into a plan or authorized request. Events document care that occurs. Local decisions and resource-specific lifecycle rules control these transitions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Separate proposed care, authorization and occurrence</tspan></text>
<polyline points="316,190.0 358,190.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="642,190.0 684,190.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="105" width="284" height="170" rx="9" fill="#f0ebfa" stroke="#735397" stroke-width="2"/>
<text x="174.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="174.0" dy="0">Proposal</tspan></text>
<text x="174.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="174.0" dy="0">Patient-specific request</tspan><tspan x="174.0" dy="21.6">Suggested activity</tspan><tspan x="174.0" dy="21.6">Supporting information</tspan></text>
<rect x="358" y="105" width="284" height="170" rx="9" fill="#fff4df" stroke="#9b6b16" stroke-width="2"/>
<text x="500.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Plan or order</tspan></text>
<text x="500.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Appropriate local decision</tspan><tspan x="500.0" dy="21.6">Intent and authorization</tspan><tspan x="500.0" dy="21.6">Links to prior requests</tspan></text>
<rect x="684" y="105" width="284" height="170" rx="9" fill="#f0ebfa" stroke="#735397" stroke-width="2"/>
<text x="826.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="826.0" dy="0">Documented event</tspan></text>
<text x="826.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="826.0" dy="0">Occurrence or not done</tspan><tspan x="826.0" dy="21.6">Resource-specific status</tspan><tspan x="826.0" dy="21.6">Link to fulfilled request</tspan></text>
<text x="32" y="325" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="32" dy="0">Conceptual flow, not automatic execution. Tasks can track work; use each resource’s actual codes.</tspan></text>
</g></svg>
