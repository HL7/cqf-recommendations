<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title description">
<title id="title">From guideline intent to evaluated use</title><desc id="description">Develop and represent guideline intent, validate the content, implement it locally, and evaluate use. Findings feed back into development and implementation.</desc>
