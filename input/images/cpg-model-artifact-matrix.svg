<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 792" role="img" aria-labelledby="title description">
  <!-- CPG-Main-LevelsAndTiers.png supplies the matrix structure. Cell content follows approach-artifacts.md; colors match cpg-model-levels.svg. -->
  <title id="title">Work products by level and responsibility</title>
  <desc id="description">A matrix crosses L1 narrative, L2 semi-structured, L3 structured, and L4 executable with Data, Clinical logic, and Forms. Each cell preserves the planning work products described in Guideline Artifacts. The level colors match the adjacent representation-level diagram. The page provides the full matrix as accessible text. Representation levels are not conformance grades, and a capability may not need a form.</desc>
  <rect width="1200" height="792" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#183e59">
    <g id="heading">
      <text x="30" y="42" text-anchor="start" font-size="29" fill="#183e59" font-weight="700">Work products by level and responsibility</text>
      <text x="30" y="76" font-size="19">Read across each row to connect clinical intent with local delivery.</text>
      <text x="36" y="211" font-size="18" font-weight="700" fill="#425666">Responsibility</text>
    </g>
    <g id="level-headings" fill="#fff">
      <g id="l1-heading">
        <rect x="200" y="108" width="232" height="112" rx="8" fill="#416e2d"/>
        <text x="220" y="147" font-size="23" font-weight="700">L1</text>
        <text x="220" y="184" font-size="23" font-weight="700">Narrative</text>
      </g>
      <g id="l2-heading">
        <rect x="444" y="108" width="232" height="112" rx="8" fill="#a34e17"/>
        <text x="464" y="147" font-size="23" font-weight="700">L2</text>
        <text x="464" y="184" font-size="23" font-weight="700">Semi-structured</text>
      </g>
      <g id="l3-heading">
        <rect x="688" y="108" width="232" height="112" rx="8" fill="#2f618d"/>
        <text x="708" y="147" font-size="23" font-weight="700">L3</text>
        <text x="708" y="184" font-size="23" font-weight="700">Structured</text>
      </g>
      <g id="l4-heading">
        <rect x="932" y="108" width="232" height="112" rx="8" fill="#a8393e"/>
        <text x="952" y="147" font-size="23" font-weight="700">L4</text>
        <text x="952" y="184" font-size="23" font-weight="700">Executable</text>
      </g>
    </g>
    <g id="data-row">
      <rect x="36" y="232" width="152" height="138" rx="8" fill="#eef3f7"/>
      <text x="54" y="271" font-size="23" font-weight="700">Data</text>
      <g id="data-l1">
        <rect x="200" y="232" width="232" height="138" rx="8" fill="#edf5e8" stroke="#cbdcbe"/>
        <text x="216" y="267" font-size="20"><tspan x="216">Clinical concepts and</tspan><tspan x="216" dy="27">relevant patient</tspan><tspan x="216" dy="27">information</tspan></text>
      </g>
      <g id="data-l2">
        <rect x="444" y="232" width="232" height="138" rx="8" fill="#fff1e4" stroke="#e8cbb1"/>
        <text x="460" y="267" font-size="20"><tspan x="460">Data dictionary,</tspan><tspan x="460" dy="27">terminology choices,</tspan><tspan x="460" dy="27">time and source rules</tspan></text>
      </g>
      <g id="data-l3">
        <rect x="688" y="232" width="232" height="138" rx="8" fill="#eaf2fb" stroke="#c1d5e8"/>
        <text x="704" y="267" font-size="20"><tspan x="704">Profiles, CodeSystems,</tspan><tspan x="704" dy="27">ValueSets, and data</tspan><tspan x="704" dy="27">requirements</tspan></text>
      </g>
      <g id="data-l4">
        <rect x="932" y="232" width="232" height="138" rx="8" fill="#fcebec" stroke="#eac1c4"/>
        <text x="948" y="267" font-size="20"><tspan x="948">Validated local</tspan><tspan x="948" dy="27">mappings and data</tspan><tspan x="948" dy="27">access</tspan></text>
      </g>
    </g>
    <g id="clinical-logic-row">
      <rect x="36" y="382" width="152" height="162" rx="8" fill="#eef3f7"/>
      <text x="54" y="421" font-size="23" font-weight="700"><tspan x="54">Clinical</tspan><tspan x="54" dy="29">logic</tspan></text>
      <g id="logic-l1">
        <rect x="200" y="382" width="232" height="162" rx="8" fill="#edf5e8" stroke="#cbdcbe"/>
        <text x="216" y="417" font-size="20"><tspan x="216">Recommendation and</tspan><tspan x="216" dy="27">clinical conditions</tspan></text>
      </g>
      <g id="logic-l2">
        <rect x="444" y="382" width="232" height="162" rx="8" fill="#fff1e4" stroke="#e8cbb1"/>
        <text x="460" y="417" font-size="20"><tspan x="460">Decision tables,</tspan><tspan x="460" dy="27">process models, and</tspan><tspan x="460" dy="27">reviewed cases</tspan></text>
      </g>
      <g id="logic-l3">
        <rect x="688" y="382" width="232" height="162" rx="8" fill="#eaf2fb" stroke="#c1d5e8"/>
        <text x="704" y="417" font-size="20"><tspan x="704">Libraries, activity and</tspan><tspan x="704" dy="27">plan definitions, and</tspan><tspan x="704" dy="27">measures where</tspan><tspan x="704" dy="27">needed</tspan></text>
      </g>
      <g id="logic-l4">
        <rect x="932" y="382" width="232" height="162" rx="8" fill="#fcebec" stroke="#eac1c4"/>
        <text x="948" y="417" font-size="20"><tspan x="948">Evaluated results from</tspan><tspan x="948" dy="27">the configured engine</tspan><tspan x="948" dy="27">or translated logic</tspan></text>
      </g>
    </g>
    <g id="forms-row">
      <rect x="36" y="556" width="152" height="162" rx="8" fill="#eef3f7"/>
      <text x="54" y="595" font-size="23" font-weight="700">Forms</text>
      <g id="forms-l1">
        <rect x="200" y="556" width="232" height="162" rx="8" fill="#edf5e8" stroke="#cbdcbe"/>
        <text x="216" y="591" font-size="20"><tspan x="216">Information to provide</tspan><tspan x="216" dy="27">or review</tspan></text>
      </g>
      <g id="forms-l2">
        <rect x="444" y="556" width="232" height="162" rx="8" fill="#fff1e4" stroke="#e8cbb1"/>
        <text x="460" y="591" font-size="20"><tspan x="460">User stories, interaction</tspan><tspan x="460" dy="27">sketches, and</tspan><tspan x="460" dy="27">branching rules</tspan></text>
      </g>
      <g id="forms-l3">
        <rect x="688" y="556" width="232" height="162" rx="8" fill="#eaf2fb" stroke="#c1d5e8"/>
        <text x="704" y="591" font-size="20"><tspan x="704">Questionnaire and</tspan><tspan x="704" dy="27">supported population</tspan><tspan x="704" dy="27">and extraction</tspan><tspan x="704" dy="27">expressions</tspan></text>
      </g>
      <g id="forms-l4">
        <rect x="932" y="556" width="232" height="162" rx="8" fill="#fcebec" stroke="#eac1c4"/>
        <text x="948" y="591" font-size="20"><tspan x="948">Rendered interactions,</tspan><tspan x="948" dy="27">permissions, and</tspan><tspan x="948" dy="27">routing</tspan></text>
      </g>
    </g>
    <text x="36" y="760" font-size="19">Representations, not conformance grades. A capability may not need a form.</text>
  </g>
</svg>
