<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title description">
<title id="title">A reviewed increment supports learning</title><desc id="description">One bounded clinical question links explicit meaning, computable content, and evaluated local use. Findings can return to clinical, artifact, or implementation owners; the loop does not automatically create new evidence or approve a change.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">A reviewed increment supports learning</tspan></text>
<polyline points="250,205.0 275,205.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="490,205.0 515,205.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="730,205.0 755,205.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="862.5,300 862.5,370 142.5,370 142.5,300" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="35" y="110" width="215" height="190" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="142.5" y="138" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="142.5" dy="0">Clinical question</tspan></text>
<text x="142.5" y="171.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="142.5" dy="0">Source, scope,</tspan><tspan x="142.5" dy="21.6">intended action and</tspan><tspan x="142.5" dy="21.6">examples</tspan></text>
<rect x="275" y="110" width="215" height="190" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="382.5" y="138" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="382.5" dy="0">Explicit meaning</tspan></text>
<text x="382.5" y="171.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="382.5" dy="0">Reviewed concepts,</tspan><tspan x="382.5" dy="21.6">criteria and workflow</tspan></text>
<rect x="515" y="110" width="215" height="190" rx="9" fill="#e6f4f1" stroke="#247268" stroke-width="2"/>
<text x="622.5" y="138" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="622.5" dy="0">Computable</tspan><tspan x="622.5" dy="25.650000000000002">content</tspan></text>
<text x="622.5" y="197.3" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="622.5" dy="0">FHIR/CQL artifacts,</tspan><tspan x="622.5" dy="21.6">dependencies and</tspan><tspan x="622.5" dy="21.6">tests</tspan></text>
<rect x="755" y="110" width="215" height="190" rx="9" fill="#fff4df" stroke="#9b6b16" stroke-width="2"/>
<text x="862.5" y="138" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="862.5" dy="0">Evaluated use</tspan></text>
<text x="862.5" y="171.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="862.5" dy="0">Local integration,</tspan><tspan x="862.5" dy="21.6">monitoring, effects</tspan><tspan x="862.5" dy="21.6">and limits</tspan></text>
<text x="28" y="425" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Return findings to the responsible reviewer. Revalidate affected products when meaning or dependencies</tspan><tspan x="28" dy="21.6">change.</tspan></text>
<text x="28" y="465" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Conceptual cycle: solid arrows = work products; dashed arrow = review and revision, not automatic learning.</tspan></text>
</g></svg>
