<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="878" viewBox="0 0 1200 878" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Four ways to integrate computable guidelines</title>
  <desc id="desc">Four panels compare direct content ingestion, a CDS Hooks service, a SMART application, and data enrichment. Arrows distinguish artifact imports, calls and responses, authorized patient data, and exchanges of derived information. CPG apply returns a transient Bundle per subject when used.</desc>
  <!-- Original sources: input/images/integration-content-ingestion.png, integration-content-service.png, integration-content-application.png, and integration-content-enrichment.png. Current CPG $apply and workflow contracts supersede the originals' return labels. -->
  <defs>
    <marker id="exchange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#28567e"/>
    </marker>
  </defs>
  <rect width="1200" height="878" fill="#fff"/>
  <text x="30" y="42" text-anchor="start" font-size="29" fill="#183e59" font-weight="700">Four ways to integrate computable guidelines</text>

  <g id="direct-content-ingestion" transform="translate(30 80)" fill="#18354d">
    <rect width="558" height="332" rx="14" fill="#fff" stroke="#9baebe" stroke-width="2"/>
    <path d="M 16 15 V 75" fill="none" stroke="#28567e" stroke-width="5"/>
    <text x="31" y="39" font-size="23" font-weight="700">Direct content ingestion</text>
    <text x="31" y="67" font-size="18">Bring the content into the receiving system.</text>

    <g id="versioned-knowledge-files" text-anchor="middle">
      <path d="M 73 114 H 116 L 129 127 V 173 H 73 Z" fill="#dce9f4" stroke="#28567e" stroke-width="2"/>
      <path d="M 62 123 H 104 L 118 137 V 182 H 62 Z M 104 123 V 137 H 118" fill="#f8fbfe" stroke="#28567e" stroke-width="2"/>
      <path d="M 73 149 H 106 M 73 159 H 106 M 73 169 H 94" stroke="#28567e" stroke-width="2"/>
      <text x="95" y="209" font-size="18" font-weight="700"><tspan x="95">PlanDefinition</tspan><tspan x="95" dy="24">CQL libraries</tspan></text>
    </g>
    <g id="import-content" text-anchor="middle">
      <text x="270" y="159" font-size="18" font-weight="700">Import or translate</text>
      <path d="M 163 180 H 375" fill="none" stroke="#28567e" stroke-width="3" marker-end="url(#exchange-arrow)"/>
    </g>
    <g id="local-evaluation" text-anchor="middle">
      <rect x="392" y="109" width="145" height="140" rx="12" fill="#f3f8fc" stroke="#28567e" stroke-width="2"/>
      <text x="464" y="138" font-size="19" font-weight="700">Receiving EHR</text>
      <text x="464" y="172" font-size="18">Evaluate locally</text>
      <path d="M 406 186 H 523" stroke="#92adbf"/>
      <text x="464" y="213" font-size="18">Clinical workflow</text>
    </g>
    <text x="31" y="283" font-size="18"><tspan x="31">The receiving system evaluates the content with local</tspan><tspan x="31" dy="24">data and delivers guidance in its own workflow.</tspan></text>
  </g>

  <g id="service-based-cds" transform="translate(612 80)" fill="#18354d">
    <rect width="558" height="332" rx="14" fill="#fff" stroke="#9baebe" stroke-width="2"/>
    <path d="M 16 15 V 75" fill="none" stroke="#28567e" stroke-width="5"/>
    <text x="31" y="39" font-size="23" font-weight="700">Service-based CDS</text>
    <text x="31" y="67" font-size="18">Call a reasoning service from a clinical workflow.</text>

    <g id="ehr-service-client" text-anchor="middle">
      <rect x="21" y="109" width="145" height="140" rx="12" fill="#f3f8fc" stroke="#28567e" stroke-width="2"/>
      <text x="93" y="138" font-size="19" font-weight="700">EHR client</text>
      <text x="93" y="172" font-size="18"><tspan x="93">Workflow event</tspan><tspan x="93" dy="24">and context</tspan></text>
    </g>
    <g id="cds-hooks-exchange" text-anchor="middle" font-size="18" font-weight="700">
      <text x="279" y="135">CDS Hooks request</text>
      <path d="M 179 154 H 374" fill="none" stroke="#28567e" stroke-width="3" marker-end="url(#exchange-arrow)"/>
      <path d="M 374 202 H 179" fill="none" stroke="#28567e" stroke-width="3" marker-end="url(#exchange-arrow)"/>
      <text x="279" y="228">Cards and actions</text>
    </g>
    <g id="cds-service-reasoning" text-anchor="middle">
      <rect x="392" y="109" width="145" height="140" rx="12" fill="#f3f8fc" stroke="#28567e" stroke-width="2"/>
      <text x="464" y="138" font-size="19" font-weight="700">CDS service</text>
      <text x="464" y="172" font-size="18"><tspan x="464">Evaluate with</tspan><tspan x="464" dy="24">patient context</tspan></text>
    </g>
    <text x="31" y="283" font-size="18"><tspan x="31">The client presents the guidance and handles supported</tspan><tspan x="31" dy="24">actions in the receiving workflow.</tspan></text>
  </g>

  <g id="smart-application" transform="translate(30 432)" fill="#18354d">
    <rect width="558" height="332" rx="14" fill="#fff" stroke="#9baebe" stroke-width="2"/>
    <path d="M 16 15 V 75" fill="none" stroke="#28567e" stroke-width="5"/>
    <text x="31" y="39" font-size="23" font-weight="700">SMART application</text>
    <text x="31" y="67" font-size="18">Present guidance through a dedicated application.</text>

    <g id="ehr-system-of-record" text-anchor="middle">
      <path d="M 35 128 V 184 C 35 207 145 207 145 184 V 128 Z" fill="#e8f2f9" stroke="#28567e" stroke-width="2"/>
      <ellipse cx="90" cy="128" rx="55" ry="13" fill="#f8fbfe" stroke="#28567e" stroke-width="2"/>
      <text x="90" y="165" font-size="19" font-weight="700">EHR data</text>
      <text x="90" y="231" font-size="18">System of record</text>
    </g>
    <g id="smart-launch-and-fhir-exchange" text-anchor="middle" font-size="18" font-weight="700">
      <text x="272" y="122"><tspan x="272">SMART launch</tspan><tspan x="272" dy="23">Authorized FHIR data</tspan></text>
      <path d="M 160 165 H 375" fill="none" stroke="#28567e" stroke-width="3" marker-end="url(#exchange-arrow)"/>
      <path d="M 375 205 H 160" fill="none" stroke="#28567e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#exchange-arrow)"/>
      <text x="272" y="230">Agreed write-back</text>
    </g>
    <g id="application-reasoning" text-anchor="middle">
      <rect x="392" y="109" width="145" height="140" rx="12" fill="#f3f8fc" stroke="#28567e" stroke-width="2"/>
      <text x="464" y="138" font-size="19" font-weight="700">Application</text>
      <text x="464" y="172" font-size="18"><tspan x="464">Evaluate here</tspan><tspan x="464" dy="24">or use a service</tspan></text>
    </g>
    <text x="31" y="283" font-size="18"><tspan x="31">The app reads data within granted scopes. Write-back</tspan><tspan x="31" dy="24">depends on the agreed deployment contract.</tspan></text>
  </g>

  <g id="data-enrichment" transform="translate(612 432)" fill="#18354d">
    <rect width="558" height="332" rx="14" fill="#fff" stroke="#9baebe" stroke-width="2"/>
    <path d="M 16 15 V 75" fill="none" stroke="#28567e" stroke-width="5"/>
    <text x="31" y="39" font-size="23" font-weight="700">Data enrichment</text>
    <text x="31" y="67" font-size="18">Exchange data and return derived information.</text>

    <g id="enrichment-ehr-data" text-anchor="middle">
      <path d="M 35 128 V 184 C 35 207 145 207 145 184 V 128 Z" fill="#e8f2f9" stroke="#28567e" stroke-width="2"/>
      <ellipse cx="90" cy="128" rx="55" ry="13" fill="#f8fbfe" stroke="#28567e" stroke-width="2"/>
      <text x="90" y="165" font-size="19" font-weight="700">EHR data</text>
      <text x="90" y="231" font-size="18">Receiving system</text>
    </g>
    <g id="data-exchange-and-results" text-anchor="middle" font-size="18" font-weight="700">
      <text x="273" y="135">Patient data exchange</text>
      <path d="M 169 154 H 374" fill="none" stroke="#28567e" stroke-width="3" marker-end="url(#exchange-arrow)"/>
      <path d="M 374 202 H 169" fill="none" stroke="#28567e" stroke-width="3" marker-end="url(#exchange-arrow)"/>
      <text x="273" y="228">Derived results</text>
    </g>
    <g id="enrichment-reasoning-system" text-anchor="middle">
      <rect x="392" y="109" width="145" height="140" rx="12" fill="#f3f8fc" stroke="#28567e" stroke-width="2"/>
      <text x="464" y="137" font-size="19" font-weight="700"><tspan x="464">Reasoning</tspan><tspan x="464" dy="22">system</tspan></text>
      <text x="464" y="194" font-size="18"><tspan x="464">Evaluate and</tspan><tspan x="464" dy="23">derive results</tspan></text>
    </g>
    <text x="31" y="283" font-size="18"><tspan x="31">FHIR APIs, messages, events, or bulk transfers carry</tspan><tspan x="31" dy="24">data under the agreed exchange and storage contract.</tspan></text>
  </g>

  <g id="cpg-apply-and-receiving-workflow" text-anchor="middle" fill="#17304b" font-size="19">
    <path d="M 30 794 H 1170" fill="none" stroke="#9baebe"/>
    <text x="600" y="823" font-weight="700">When used, CPG PlanDefinition $apply returns a transient Bundle per subject.</text>
    <text x="600" y="850">The receiving workflow handles presentation, authorization, and persistence.</text>
  </g>
</svg>
