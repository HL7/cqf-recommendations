<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title description">
<title id="title">From recommendation to content package</title><desc id="description">Read left to right. Each box identifies a work product to review; arrows show the handoff, not automatic clinical approval.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">From recommendation to content package</tspan></text>
<polyline points="195,197.5 220,197.5" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="390,197.5 415,197.5" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="585,197.5 610,197.5" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="780,197.5 805,197.5" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="25" y="105" width="170" height="185" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="110.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="110.0" dy="0">Select</tspan></text>
<text x="110.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="110.0" dy="0">Source, scope,</tspan><tspan x="110.0" dy="21.6">actors,</tspan><tspan x="110.0" dy="21.6">intended</tspan><tspan x="110.0" dy="21.6">delivery</tspan></text>
<rect x="220" y="105" width="170" height="185" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="305.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="305.0" dy="0">Represent</tspan></text>
<text x="305.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="305.0" dy="0">Data</tspan><tspan x="305.0" dy="21.6">dictionary,</tspan><tspan x="305.0" dy="21.6">decisions,</tspan><tspan x="305.0" dy="21.6">example cases</tspan></text>
<rect x="415" y="105" width="170" height="185" rx="9" fill="#e6f4f1" stroke="#247268" stroke-width="2"/>
<text x="500.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Translate</tspan></text>
<text x="500.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">FHIR/CQL</tspan><tspan x="500.0" dy="21.6">artifacts and</tspan><tspan x="500.0" dy="21.6">dependencies</tspan></text>
<rect x="610" y="105" width="170" height="185" rx="9" fill="#e6f4f1" stroke="#247268" stroke-width="2"/>
<text x="695.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="695.0" dy="0">Validate</tspan></text>
<text x="695.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="695.0" dy="0">Separate</tspan><tspan x="695.0" dy="21.6">clinical and</tspan><tspan x="695.0" dy="21.6">technical</tspan><tspan x="695.0" dy="21.6">findings</tspan></text>
<rect x="805" y="105" width="170" height="185" rx="9" fill="#f0ebfa" stroke="#735397" stroke-width="2"/>
<text x="890.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="890.0" dy="0">Package</tspan></text>
<text x="890.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="890.0" dy="0">Approved</tspan><tspan x="890.0" dy="21.6">version, tests,</tspan><tspan x="890.0" dy="21.6">implementation</tspan><tspan x="890.0" dy="21.6">notes</tspan></text>
<text x="28" y="330" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Review clinical meaning throughout. A failed check can return work to an earlier step.</tspan></text>
<text x="28" y="370" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Legend: blue = knowledge; green = logic/testing; amber = local workflow; purple = release/result.</tspan></text>
</g></svg>
