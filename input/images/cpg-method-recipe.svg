<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img" aria-labelledby="title description">
<title id="title">From a recommendation to a reviewed package</title><desc id="description">Select the scope, represent the clinical decisions, translate them to artifacts, validate against clinical and technical expectations, and package the reviewed work. Validation can send work back to earlier steps.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">From a recommendation to a reviewed package</tspan></text>
<text x="28" y="65" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Each step produces something the team can review</tspan></text>
<polyline points="195,180.0 220,180.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="390,180.0 415,180.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="585,180.0 610,180.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="780,180.0 805,180.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="695.0,260 695,312 110,312 110.0,260" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="324.5" y="299" width="155" height="23" fill="#fff"/>
<text x="402" y="316" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="402" dy="0">Revise as needed</tspan></text>
<rect x="25" y="100" width="170" height="160" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="110.0" y="128" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="110.0" dy="0">Select</tspan></text>
<text x="110.0" y="161.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="110.0" dy="0">Source</tspan><tspan x="110.0" dy="21.6">Scope and users</tspan><tspan x="110.0" dy="21.6">Care setting</tspan></text>
<rect x="220" y="100" width="170" height="160" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="305.0" y="128" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="305.0" dy="0">Represent</tspan></text>
<text x="305.0" y="161.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="305.0" dy="0">Data and rules</tspan><tspan x="305.0" dy="21.6">Worked cases</tspan></text>
<rect x="415" y="100" width="170" height="160" rx="9" fill="#e6f4f1" stroke="#247268" stroke-width="2"/>
<text x="500.0" y="128" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Translate</tspan></text>
<text x="500.0" y="161.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">FHIR artifacts</tspan><tspan x="500.0" dy="21.6">CQL and codes</tspan><tspan x="500.0" dy="21.6">Dependencies</tspan></text>
<rect x="610" y="100" width="170" height="160" rx="9" fill="#e6f4f1" stroke="#247268" stroke-width="2"/>
<text x="695.0" y="128" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="695.0" dy="0">Validate</tspan></text>
<text x="695.0" y="161.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="695.0" dy="0">Clinical review</tspan><tspan x="695.0" dy="21.6">Technical tests</tspan><tspan x="695.0" dy="21.6">Open issues</tspan></text>
<rect x="805" y="100" width="170" height="160" rx="9" fill="#f0ebfa" stroke="#735397" stroke-width="2"/>
<text x="890.0" y="128" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="890.0" dy="0">Package</tspan></text>
<text x="890.0" y="161.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="890.0" dy="0">Release version</tspan><tspan x="890.0" dy="21.6">Tests and notes</tspan><tspan x="890.0" dy="21.6">Known gaps</tspan></text>
<text x="28" y="362" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Review clinical meaning throughout. Validation can return work to any earlier step.</tspan></text>
</g></svg>
