<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355" role="img" aria-labelledby="title description">
<title id="title">Give data, clinical logic and forms distinct responsibilities</title><desc id="description">Data definitions describe clinical information. Clinical logic interprets the information and proposes care. Forms collect or display information while reusing those definitions and logic.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Give data, clinical logic and forms distinct responsibilities</tspan></text>
<polyline points="316,190.0 358,190.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="642,190.0 684,190.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="105" width="284" height="170" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="174.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="174.0" dy="0">Data</tspan></text>
<text x="174.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="174.0" dy="0">Meaning, codes and units</tspan><tspan x="174.0" dy="21.6">Structure and time</tspan><tspan x="174.0" dy="21.6">Local mapping contract</tspan></text>
<rect x="358" y="105" width="284" height="170" rx="9" fill="#e6f4f1" stroke="#247268" stroke-width="2"/>
<text x="500.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Clinical logic</tspan></text>
<text x="500.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Patient description</tspan><tspan x="500.0" dy="21.6">Applicability and activities</tspan><tspan x="500.0" dy="21.6">Reusable expressions</tspan></text>
<rect x="684" y="105" width="284" height="170" rx="9" fill="#fff4df" stroke="#9b6b16" stroke-width="2"/>
<text x="826.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="826.0" dy="0">Forms</tspan></text>
<text x="826.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="826.0" dy="0">Collect or confirm data</tspan><tspan x="826.0" dy="21.6">Interaction and branching</tspan><tspan x="826.0" dy="21.6">Reuse clinical meaning</tspan></text>
<text x="32" y="325" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="32" dy="0">Arrows show reuse, not a required deployment sequence. A guideline service may need no form.</tspan></text>
</g></svg>
