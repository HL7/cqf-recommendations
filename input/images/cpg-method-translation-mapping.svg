<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-labelledby="title description">
<title id="title">How source guidance maps to computable artifacts</title><desc id="description">One-to-many: one narrative recommendation yields separate specifications for data and decision criteria and for workflow. The criteria specification informs a data profile and a logic library, and the workflow specification informs an activity definition. Many-to-one: two narrative recommendations and their respective reviewed specifications both inform a shared data profile.</desc>
