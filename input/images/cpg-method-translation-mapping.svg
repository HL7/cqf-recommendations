<title id="title">From source material to FHIR and CQL</title><desc id="description">Journal article A informs the data dictionary and decision criteria. Article B also informs the criteria. The data dictionary informs a FHIR data profile and a CQL library, and the criteria also inform the library. A guideline passage leads to one proposed activity and its FHIR ActivityDefinition.</desc>
