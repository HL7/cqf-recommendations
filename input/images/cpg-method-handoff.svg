<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Integrated process for developing and implementing clinical practice guidelines</title>
  <desc id="desc">Twelve phases run clockwise from concept and planning through narrative and semi-structured development, structured development, and executable implementation. The outer green ring represents guideline development, the blue ring represents informatics, and the gray ring represents evaluation. Users are at the center. Arrows show end-user input during planning, iteration during development, and feedback during implementation and revision.</desc>
  <!-- Redrawn from input/images/CPG-04.05-01.png, based on Matson-Koffman et al. and Tailor et al. (2023). -->
  <defs>
    <marker id="loop-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="26" markerHeight="26" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#329b9c"/>
    </marker>
  </defs>

  <rect width="1200" height="960" fill="#fff"/>

  <g id="quadrant-borders" fill="none" stroke="#b5c6db" stroke-width="2">
    <rect x="8" y="16" width="462" height="464" rx="24"/>
    <rect x="470" y="16" width="462" height="464" rx="24"/>
    <rect x="8" y="480" width="462" height="464" rx="24"/>
    <rect x="470" y="480" width="462" height="464" rx="24"/>
  </g>

  <g id="activity-rings" stroke-width="2">
    <circle cx="470" cy="480" r="448" fill="#e4eed8" stroke="#8aa17c"/>
    <circle cx="470" cy="480" r="298" fill="#d2e1f4" stroke="#8ba7c6"/>
    <circle cx="470" cy="480" r="158" fill="#e2e6eb" stroke="#a1aab5"/>
    <path d="M 470 32 V 928 M 22 480 H 918" fill="none" stroke="#8b9da6"/>
    <path d="M 549 343 L 694 92 M 607 401 L 858 256 M 607 559 L 858 704 M 549 617 L 694 868 M 391 617 L 246 868 M 333 559 L 82 704 M 333 401 L 82 256 M 391 343 L 246 92" fill="none" stroke="#899a9d" stroke-dasharray="7 7"/>
  </g>

  <g id="feedback-and-iteration-arrows" fill="none" stroke="#329b9c" stroke-width="12" stroke-linecap="round" marker-end="url(#loop-arrow)" opacity=".43">
    <path d="M 178 298 C 82 335 117 253 183 193 C 223 155 279 125 324 111"/>
    <path d="M 333 110 C 376 111 338 177 267 226"/>
    <path d="M 584 288 C 527 251 510 177 552 151 C 573 138 601 137 631 145"/>
    <path d="M 680 156 C 745 184 791 237 771 275 C 757 302 722 310 684 287"/>
    <path d="M 271 727 C 245 694 283 679 327 686 C 386 695 446 718 516 747"/>
    <path d="M 537 755 C 615 793 621 824 548 830 C 467 838 352 797 277 741"/>
  </g>

  <g id="quadrant-labels" fill="#24486d" font-size="21" font-weight="700">
    <text x="38" y="55"><tspan x="38">Executable</tspan><tspan x="38" dy="25">Implementation</tspan><tspan x="38" dy="25">(L4)</tspan></text>
    <text x="901" y="55" text-anchor="end"><tspan x="901">Concept &amp;</tspan><tspan x="901" dy="25">Planning</tspan></text>
    <text x="38" y="874"><tspan x="38">Structured</tspan><tspan x="38" dy="25">Development (L3)</tspan></text>
    <text x="901" y="852" text-anchor="end"><tspan x="901">Narrative</tspan><tspan x="901" dy="25">Recommendations &amp;</tspan><tspan x="901" dy="25">Semi-structured</tspan><tspan x="901" dy="25">Development (L1 &amp; L2)</tspan></text>
  </g>

  <g id="activity-ring-labels" text-anchor="middle" font-size="20" font-weight="700" paint-order="stroke fill" stroke-width="7" stroke-linejoin="round">
    <text x="470" y="65" fill="#315e3e" stroke="#e4eed8"><tspan x="470">Guideline Development</tspan><tspan x="470" dy="22">Activities</tspan></text>
    <text x="470" y="205" fill="#254f7f" stroke="#d2e1f4"><tspan x="470">Informatics</tspan><tspan x="470" dy="22">Activities</tspan></text>
    <text x="470" y="349" fill="#394754" stroke="#e2e6eb">Evaluation</text>
  </g>

  <g id="phase-numbers" fill="#556752" font-size="20" font-weight="700" text-anchor="middle">
    <text x="616" y="82">1</text>
    <text x="774" y="187">2</text>
    <text x="880" y="357">3</text>
    <text x="875" y="600">4</text>
    <text x="793" y="767">5</text>
    <text x="587" y="905">6</text>
    <text x="353" y="905">7</text>
    <text x="174" y="798">8</text>
    <text x="59" y="601">9</text>
    <text x="59" y="389">10</text>
    <text x="167" y="191">11</text>
    <text x="324" y="82">12</text>
  </g>

  <g id="guideline-activities" fill="#203522" font-size="18" font-weight="700" text-anchor="middle">
    <text id="guideline-phase-1" x="561" y="120"><tspan x="561">Define clinical</tspan><tspan x="561" dy="20">problem or</tspan><tspan x="561" dy="20">guideline to</tspan><tspan x="561" dy="20">be reviewed</tspan></text>
    <text id="guideline-phase-2" x="746" y="216"><tspan x="746">Establish</tspan><tspan x="746" dy="20">Steering</tspan><tspan x="746" dy="20">Committee</tspan></text>
    <text id="guideline-phase-3" x="824" y="381"><tspan x="824">Establish</tspan><tspan x="824" dy="20">Systematic</tspan><tspan x="824" dy="20">Review Team</tspan></text>
    <text id="guideline-phase-4" x="829" y="538"><tspan x="829">Scope</tspan><tspan x="829" dy="20">guideline</tspan></text>
    <text id="guideline-phase-5" x="730" y="720"><tspan x="730">Analyze &amp;</tspan><tspan x="730" dy="20">Synthesize</tspan><tspan x="730" dy="20">Evidence</tspan></text>
    <text id="guideline-phase-6" x="560" y="838"><tspan x="560">Formulate</tspan><tspan x="560" dy="20">recommendations</tspan></text>
    <text id="guideline-phase-7" x="368" y="838"><tspan x="368">Draft Guideline</tspan><tspan x="368" dy="20">Text/Manuscript</tspan></text>
    <text id="guideline-phase-8" x="213" y="731"><tspan x="213">Internal/External</tspan><tspan x="213" dy="20">Peer Review &amp;</tspan><tspan x="213" dy="20">Public Comment</tspan></text>
    <text id="guideline-phase-9" x="109" y="532"><tspan x="109">Finalize,</tspan><tspan x="109" dy="20">publish &amp;</tspan><tspan x="109" dy="20">disseminate</tspan><tspan x="109" dy="20">guideline</tspan></text>
    <g id="guideline-phase-10">
      <text x="105" y="309" fill="#4b6050" font-size="15" font-style="italic" font-weight="400"><tspan x="105">Localize best</tspan><tspan x="105" dy="17">practice</tspan></text>
      <text x="113" y="347" fill="#4b6050" font-size="15" font-style="italic" font-weight="400"><tspan x="113">Define objectives</tspan><tspan x="113" dy="17">(local leaders)</tspan></text>
      <text x="105" y="409"><tspan x="105">Implement</tspan><tspan x="105" dy="20">guideline in</tspan><tspan x="105" dy="20">clinical</tspan><tspan x="105" dy="20">settings</tspan></text>
    </g>
    <g id="guideline-phase-11">
      <text x="273" y="180"><tspan x="273">Measure &amp;</tspan><tspan x="273" dy="20">improve</tspan></text>
      <text x="206" y="254"><tspan x="206">Evaluate</tspan><tspan x="206" dy="20">guideline</tspan></text>
    </g>
    <text id="guideline-phase-12" x="378" y="120"><tspan x="378">Update or</tspan><tspan x="378" dy="20">discontinue</tspan><tspan x="378" dy="20">guideline</tspan></text>
  </g>

  <g id="informatics-activities" fill="#223f60" font-size="18" font-weight="700">
    <text id="informatics-phase-1" x="481" y="257"><tspan x="481">Collect/create</tspan><tspan x="481" dy="20">evidence</tspan><tspan x="481" dy="20">(CPG eCR)</tspan></text>
    <text id="informatics-phase-2" x="621" y="310"><tspan x="621">Establish</tspan><tspan x="621" dy="20">informatics</tspan><tspan x="621" dy="20">team</tspan></text>
    <text id="informatics-phase-3" x="639" y="409"><tspan x="639">Set up</tspan><tspan x="639" dy="20">platforms &amp;</tspan><tspan x="639" dy="20">tooling</tspan></text>
    <text id="informatics-phase-4" x="634" y="524"><tspan x="634">Formalize</tspan><tspan x="634" dy="20">CPG concepts</tspan></text>
    <text id="informatics-phase-5" x="584" y="624"><tspan x="584">Specify CPG</tspan><tspan x="584" dy="20">artifacts (logic,</tspan><tspan x="584" dy="20">expressions)</tspan></text>
    <text id="informatics-phase-6" x="481" y="671" font-size="17"><tspan x="481">Create use</tspan><tspan x="481" dy="20">cases and</tspan><tspan x="481" dy="20">workflows</tspan><tspan x="481" dy="20">Build/test CPG</tspan></text>
    <text id="informatics-phase-7" x="404" y="667" font-size="17" text-anchor="middle"><tspan x="404">Finalize</tspan><tspan x="404" dy="20">CPG &amp;</tspan><tspan x="404" dy="20">documentation</tspan></text>
    <text id="informatics-phase-8" x="354" y="629" text-anchor="end"><tspan x="354">Finalize CPG</tspan><tspan x="354" dy="20">derivatives</tspan></text>
    <text id="informatics-phase-9" x="299" y="524" text-anchor="end"><tspan x="299">Release CPG</tspan><tspan x="299" dy="20">to digital</tspan><tspan x="299" dy="20">platforms</tspan></text>
    <text id="informatics-phase-10" x="308" y="399" font-size="17" text-anchor="end"><tspan x="308">Incorporate</tspan><tspan x="308" dy="20">into local</tspan><tspan x="308" dy="20">clinical systems</tspan><tspan x="308" dy="20">(CDS, other)</tspan></text>
    <text id="informatics-phase-11" x="348" y="300" text-anchor="end"><tspan x="348">Clinically</tspan><tspan x="348" dy="20">validate CDS,</tspan><tspan x="348" dy="20">eCQMs, apps</tspan></text>
    <text id="informatics-phase-12" x="411" y="257" text-anchor="middle"><tspan x="411">Use CDS,</tspan><tspan x="411" dy="20">eCQMs &amp;</tspan><tspan x="411" dy="20">apps</tspan></text>
  </g>

  <g id="evaluation-activities" fill="#394754" font-size="18" font-weight="700" text-anchor="middle">
    <text x="551" y="406">Process</text>
    <text x="550" y="554"><tspan x="550">Process &amp;</tspan><tspan x="550" dy="20">product</tspan></text>
    <text x="390" y="554"><tspan x="390">Process &amp;</tspan><tspan x="390" dy="20">product</tspan></text>
    <text x="390" y="398"><tspan x="390">Product &amp;</tspan><tspan x="390" dy="20">outcome</tspan></text>
  </g>

  <g id="users-at-the-center" text-anchor="middle" fill="#583419">
    <circle cx="470" cy="480" r="62" fill="#ffc99e" stroke="#bd8254" stroke-width="2"/>
    <text x="470" y="471" font-size="25" font-weight="700">Users*</text>
    <text x="470" y="493" font-size="14" font-weight="700"><tspan x="470">Human-centered</tspan><tspan x="470" dy="17">design</tspan></text>
  </g>

  <g id="loop-labels" fill="#14656f" font-size="18" font-weight="700" font-style="italic" text-anchor="middle" paint-order="stroke fill" stroke="#e4eed8" stroke-width="4" stroke-linejoin="round">
    <text x="173" y="221" transform="rotate(-43 173 221)">Feedback loop</text>
    <text x="674" y="159" transform="rotate(33 674 159)">End-user input</text>
    <text x="416" y="810" transform="rotate(20 416 810)">Iterative processes</text>
  </g>

  <g id="reading-guide-and-legend" font-size="17" fill="#24384a">
    <rect x="953" y="488" width="230" height="426" rx="16" fill="#f7f9fb" stroke="#c8d5df" stroke-width="2"/>
    <text x="971" y="526" font-size="21" font-weight="700" fill="#183e59">How to read</text>
    <text x="971" y="553"><tspan x="971">Start at phase 1 in the</tspan><tspan x="971" dy="22">upper right and follow</tspan><tspan x="971" dy="22">the phases clockwise</tspan><tspan x="971" dy="22">through phase 12.</tspan><tspan x="971" dy="22">Teams may tailor the</tspan><tspan x="971" dy="22">process to their needs.</tspan></text>
    <path d="M 971 689 H 1165" fill="none" stroke="#c8d5df"/>
    <text x="971" y="719" font-size="21" font-weight="700" fill="#183e59">Legend</text>
    <rect x="971" y="737" width="20" height="15" rx="2" fill="#e4eed8" stroke="#8aa17c"/>
    <text x="1000" y="750">Guideline activities</text>
    <rect x="971" y="763" width="20" height="15" rx="2" fill="#d2e1f4" stroke="#8ba7c6"/>
    <text x="1000" y="776">Informatics activities</text>
    <rect x="971" y="789" width="20" height="15" rx="2" fill="#e2e6eb" stroke="#a1aab5"/>
    <text x="1000" y="802">Evaluation activities</text>
    <text x="971" y="835"><tspan x="971">*Users include clinicians,</tspan><tspan x="971" dy="21">healthcare providers,</tspan><tspan x="971" dy="21">policy makers, and</tspan><tspan x="971" dy="21">other end users.</tspan></text>
  </g>
</svg>
