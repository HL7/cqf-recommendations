<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="615" viewBox="0 0 1000 615" role="img" aria-labelledby="title description">
<title id="title">Review the handoffs, keep the responsibilities</title><desc id="description">A simplified conceptual handoff connects clinical authors, knowledge engineers, and local implementors. Findings return to the responsible reviewers; this is not a reproduction of the published twelve-phase integrated process.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Review the handoffs, keep the responsibilities</tspan></text>
<polyline points="320,190.0 357,190.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="642,190.0 679,190.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="821.5,275 821.5,330 870,330 870,430 820,430.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="180,430.0 100,430 100,325 177.5,325 177.5,275" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="35" y="105" width="285" height="170" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="177.5" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="177.5" dy="0">Clinical authors</tspan></text>
<text x="177.5" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="177.5" dy="0">Source, scope, evidence,</tspan><tspan x="177.5" dy="21.6">recommendation and examples</tspan></text>
<rect x="357" y="105" width="285" height="170" rx="9" fill="#e6f4f1" stroke="#247268" stroke-width="2"/>
<text x="499.5" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="499.5" dy="0">Knowledge engineers</tspan></text>
<text x="499.5" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="499.5" dy="0">Explicit concepts, decisions,</tspan><tspan x="499.5" dy="21.6">artifacts and tests</tspan></text>
<rect x="679" y="105" width="285" height="170" rx="9" fill="#fff4df" stroke="#9b6b16" stroke-width="2"/>
<text x="821.5" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="821.5" dy="0">Local implementors</tspan></text>
<text x="821.5" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="821.5" dy="0">Data, workflow, capabilities</tspan><tspan x="821.5" dy="21.6">and evaluation</tspan></text>
<rect x="180" y="370" width="640" height="120" rx="9" fill="#f0ebfa" stroke="#735397" stroke-width="2"/>
<text x="500.0" y="398" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Reviewed feedback</tspan></text>
<text x="500.0" y="431.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Resolve findings with the clinical, artifact, or local owner; revise</tspan><tspan x="500.0" dy="21.6">linked products.</tspan></text>
<text x="28" y="535" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Conceptual summary informed by the integrated process (Matson-Koffman et al., 2023).</tspan></text>
<text x="28" y="575" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Legend: solid arrows = work-product handoffs; dashed arrow = reviewed revisions.</tspan></text>
</g></svg>
