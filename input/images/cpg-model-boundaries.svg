<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="409" viewBox="0 0 1000 409" role="img" aria-labelledby="title description">
<title id="title">Case, Plan and Workflow</title><desc id="description">Case Features describe the patient. Evaluation applies the reusable Plan to those features. The local Workflow reviews proposals, authorizes and delivers care, and documents what happened for later evaluation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Case, Plan and Workflow</tspan></text>
<polyline points="316,190.0 358,190.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="642,190.0 684,190.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="826.0,275 826,305 174,305 174.0,275" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="32" y="105" width="284" height="170" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="174.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="174.0" dy="0">Case</tspan></text>
<text x="174.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="174.0" dy="0">Patient information</tspan><tspan x="174.0" dy="21.6">Records and assessments</tspan><tspan x="174.0" dy="21.6">Inferred Case Features</tspan></text>
<rect x="358" y="105" width="284" height="170" rx="9" fill="#e6f4f1" stroke="#247268" stroke-width="2"/>
<text x="500.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Plan</tspan></text>
<text x="500.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Reusable clinical guidance</tspan><tspan x="500.0" dy="21.6">Recommendations</tspan><tspan x="500.0" dy="21.6">Strategies and pathways</tspan></text>
<rect x="684" y="105" width="284" height="170" rx="9" fill="#fff4df" stroke="#9b6b16" stroke-width="2"/>
<text x="826.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="826.0" dy="0">Workflow</tspan></text>
<text x="826.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="826.0" dy="0">Review and authorize</tspan><tspan x="826.0" dy="21.6">Deliver and document care</tspan><tspan x="826.0" dy="21.6">Track responsibility</tspan></text>
<text x="32" y="350" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="32" dy="0">Evaluate the Plan using Case Features. The local Workflow reviews any resulting proposals.</tspan></text>
<text x="32" y="378" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="32" dy="0">The dashed arrow shows how documented care can inform a later evaluation.</tspan></text>
</g></svg>
