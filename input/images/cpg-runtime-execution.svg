<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="595" viewBox="0 0 1000 595" role="img" aria-labelledby="title description">
<title id="title">Choose how the knowledge will run</title><desc id="description">Shared computable content can be reimplemented manually, translated, or executed natively. Each route needs local verification.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Choose how the knowledge will run</tspan></text>
<polyline points="500.0,230 500,260 165,260 165.0,300" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="500.0,230 500.0,300" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="500.0,230 500,260 835,260 835.0,300" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="365" y="100" width="270" height="130" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="500.0" y="128" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Computable content</tspan></text>
<text x="500.0" y="161.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Definitions, logic,</tspan><tspan x="500.0" dy="21.6">terminology</tspan></text>
<rect x="30" y="300" width="270" height="130" rx="9" fill="#fff4df" stroke="#9b6b16" stroke-width="2"/>
<text x="165.0" y="328" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="165.0" dy="0">Manual</tspan></text>
<text x="165.0" y="361.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="165.0" dy="0">Implement from the</tspan><tspan x="165.0" dy="21.6">specification</tspan></text>
<rect x="365" y="300" width="270" height="130" rx="9" fill="#e6f4f1" stroke="#247268" stroke-width="2"/>
<text x="500.0" y="328" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Translation</tspan></text>
<text x="500.0" y="361.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Convert to a supported</tspan><tspan x="500.0" dy="21.6">language</tspan></text>
<rect x="700" y="300" width="270" height="130" rx="9" fill="#e6f4f1" stroke="#247268" stroke-width="2"/>
<text x="835.0" y="328" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="835.0" dy="0">Native execution</tspan></text>
<text x="835.0" y="361.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="835.0" dy="0">Evaluate in a compatible</tspan><tspan x="835.0" dy="21.6">engine</tspan></text>
<text x="500" y="490" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="500" dy="0">For every route: verify meaning, data mappings, dependencies, and expected results.</tspan></text>
<text x="500" y="535" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="500" dy="0">The delivery interface is a separate choice: service, application, or local workflow.</tspan></text>
</g></svg>
