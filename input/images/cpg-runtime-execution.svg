<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="326" viewBox="0 0 1000 326" role="img" aria-labelledby="title description">
<title id="title">Execution routes</title><desc id="description">Shared computable content can be reimplemented manually, translated, or executed natively. Each route needs local verification.</desc>
