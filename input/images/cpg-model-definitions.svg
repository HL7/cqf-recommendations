<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" role="img" aria-labelledby="title description">
<title id="title">Use the supported definition relationships</title><desc id="description">CPGPathwayDefinition references strategy or workflow definitions. CPGStrategyDefinition references recommendation definitions. Recommendation definitions reference activity or order-set definitions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Use the supported definition relationships</tspan></text>
<polyline points="316,190.0 358,190.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="642,190.0 684,190.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="826.0,275 826.0,355" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="105" width="284" height="170" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="174.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="174.0" dy="0">Pathway definition</tspan></text>
<text x="174.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="174.0" dy="0">PlanDefinition</tspan><tspan x="174.0" dy="21.6">clinical-protocol</tspan><tspan x="174.0" dy="21.6">Longitudinal grouping</tspan></text>
<rect x="358" y="105" width="284" height="170" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="500.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">Strategy definition</tspan></text>
<text x="500.0" y="166.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="500.0" dy="0">PlanDefinition</tspan><tspan x="500.0" dy="21.6">workflow-definition</tspan><tspan x="500.0" dy="21.6">Related recommendations</tspan></text>
<rect x="684" y="105" width="284" height="170" rx="9" fill="#e6f4f1" stroke="#247268" stroke-width="2"/>
<text x="826.0" y="133" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="826.0" dy="0">Recommendation</tspan><tspan x="826.0" dy="25.650000000000002">definition</tspan></text>
<text x="826.0" y="192.3" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="826.0" dy="0">PlanDefinition</tspan><tspan x="826.0" dy="21.6">eca-rule</tspan><tspan x="826.0" dy="21.6">Applicability and activity</tspan></text>
<rect x="684" y="355" width="284" height="160" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="826.0" y="383" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="826.0" dy="0">Activity or order set</tspan></text>
<text x="826.0" y="416.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="826.0" dy="0">ActivityDefinition or</tspan><tspan x="826.0" dy="21.6">CPGOrderSetDefinition</tspan><tspan x="826.0" dy="21.6">Content for the request</tspan></text>
<text x="32" y="335" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="32" dy="0">The pathway can alternatively reference CPGWorkflowDefinition.</tspan></text>
<text x="32" y="385" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="32" dy="0">See the profile table for exact names and allowed targets.</tspan></text>
<text x="32" y="445" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="32" dy="0">These are knowledge references, not patient actions.</tspan></text>
</g></svg>
