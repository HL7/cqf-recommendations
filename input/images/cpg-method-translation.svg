<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title description">
<title id="title">Resolve meaning before formal authoring</title><desc id="description">A clinical source and examples are refined into an explicit specification reviewed by clinical and terminology experts before formal FHIR/CQL authoring.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52687a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Resolve meaning before formal authoring</tspan></text>
<polyline points="320,215.0 357,215.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="642,215.0 679,215.0" fill="none" stroke="#52687a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="35" y="110" width="285" height="210" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="177.5" y="138" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="177.5" dy="0">Source meaning</tspan></text>
<text x="177.5" y="171.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="177.5" dy="0">Recommendation, evidence,</tspan><tspan x="177.5" dy="21.6">clinical examples and data</tspan><tspan x="177.5" dy="21.6">assumptions</tspan></text>
<rect x="357" y="110" width="285" height="210" rx="9" fill="#eaf2fb" stroke="#35618e" stroke-width="2"/>
<text x="499.5" y="138" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="499.5" dy="0">Explicit specification</tspan></text>
<text x="499.5" y="171.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="499.5" dy="0">Concepts, criteria, timing,</tspan><tspan x="499.5" dy="21.6">exceptions and expected</tspan><tspan x="499.5" dy="21.6">results; clinical review</tspan></text>
<rect x="679" y="110" width="285" height="210" rx="9" fill="#e6f4f1" stroke="#247268" stroke-width="2"/>
<text x="821.5" y="138" font-size="19" font-weight="700" text-anchor="middle" fill="#22384b"><tspan x="821.5" dy="0">Formal artifacts</tspan></text>
<text x="821.5" y="171.65" font-size="16" font-weight="400" text-anchor="middle" fill="#22384b"><tspan x="821.5" dy="0">FHIR profiles and</tspan><tspan x="821.5" dy="21.6">terminology; Library/CQL;</tspan><tspan x="821.5" dy="21.6">PlanDefinition /</tspan><tspan x="821.5" dy="21.6">ActivityDefinition</tspan></text>
<text x="28" y="365" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Record unresolved questions and mapping qualifications. Tools do not decide clinical meaning.</tspan></text>
<text x="28" y="405" font-size="16" font-weight="400" text-anchor="start" fill="#22384b"><tspan x="28" dy="0">Legend: blue = clinical/specification work; green = formal artifacts. Arrows = reviewed handoffs.</tspan></text>
</g></svg>
