<div style="clear: both;">
  <object data="{{ include.src }}" type="image/svg+xml" aria-label="{{ include.alt | escape }}" style="display:block;width:100%;max-width:1000px;aspect-ratio:{{ include.ratio }};">
    <img src="{{ include.src }}" alt="{{ include.alt | escape }}" width="1000" style="max-width:100%;height:auto;"/>
  </object>
</div>
