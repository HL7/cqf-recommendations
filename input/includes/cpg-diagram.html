<figure class="cpg-figure" style="clear: both; max-width: 1000px; margin: 24px auto;">
  <div class="cpg-diagram" style="box-shadow: 0 1px 6px rgba(24, 62, 89, 0.12);">
    {% if include.ratio %}
    <object data="{{ include.src }}" type="image/svg+xml" aria-label="{{ include.alt | escape }}" style="display: block; width: 100%; aspect-ratio: {{ include.ratio }};">
      <img src="{{ include.src }}" alt="{{ include.alt | escape }}" width="1000" style="max-width: 100%; height: auto;"/>
    </object>
    {% else %}
    <img src="{{ include.src }}" alt="{{ include.alt | escape }}" class="img-responsive" width="1000"/>
    {% endif %}
  </div>
  {% if include.caption or include.text_version %}
  <figcaption style="margin-top: 12px; font-style: italic;">
    {% if include.caption %}
    {{ include.caption | markdownify | strip | remove_first: '<p>' | remove_first: '</p>' }}
    {% endif %}
    {% if include.text_version %}
    <details style="margin-top: 6px;">
      <summary style="display: list-item; cursor: pointer;">Text version of this diagram</summary>
      <div style="margin-top: 8px; font-style: normal;">
        {{ include.text_version }}
      </div>
    </details>
    {% endif %}
  </figcaption>
  {% endif %}
</figure>
